name: gamelucx_store
description: "GameLuX Store - Aplicativo Mobile para Comércio de PCs Gamer, Periféricos e Videogames. Projeto da Situação de Aprendizagem PPDM SENAI Roberto Mange."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/imagens/logo_gamelux.jpg
    - assets/imagens/banner_promocao.jpg
    - assets/imagens/pc_gamer_nexus.jpg
    - assets/imagens/teclado_mouse.jpg
    - assets/imagens/console_aether.jpg
